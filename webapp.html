<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON CASINO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0613; --bg2:#140c24; --panel:#180f2a;
    --pink:#ff2d78; --cyan:#19e8ff; --gold:#ffc342; --green:#2bffa3; --red:#ff3b3b; --black:#1a1a22;
    --text:#f3eefc; --dim:#a89fc4;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* ТЕМИ з крамниці — перефарбовують лише "брендові" кольори
     (pink/cyan/gold), а --green/--red лишаються семантикою
     виграшу/програшу в усіх іграх, тому теми ніде не ламають сенс кольору. */
  :root[data-theme="gold"]{ --pink:#ffb020; --cyan:#ffe08a; --gold:#fff1b8; }
  :root[data-theme="cyber"]{ --pink:#a855f7; --cyan:#22d3ee; --gold:#c084fc; }
  :root[data-theme="emerald"]{ --pink:#10b981; --cyan:#5eead4; --gold:#6ee7b7; }
  :root[data-theme="crimson"]{ --pink:#ef4444; --cyan:#fb7185; --gold:#fca5a5; }
  :root[data-theme="violet"]{ --pink:#8b5cf6; --cyan:#c4b5fd; --gold:#d8b4fe; }
  :root[data-theme="ice"]{ --pink:#38bdf8; --cyan:#a5f3fc; --gold:#e0f2fe; }
  :root[data-theme="sunset"]{ --pink:#fb923c; --cyan:#f472b6; --gold:#fde68a; }
  :root[data-theme="ocean"]{ --pink:#0ea5e9; --cyan:#2dd4bf; --gold:#7dd3fc; }
  :root[data-theme="matrix"]{ --pink:#22c55e; --cyan:#4ade80; --gold:#86efac; }
  :root[data-theme="royal"]{ --pink:#6366f1; --cyan:#fbbf24; --gold:#fcd34d; }
  *{box-sizing:inherit;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(ellipse 80% 50% at 50% -10%, #2a123f 0%, var(--bg) 55%);color:var(--text);font-family:'Manrope',sans-serif;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  button:disabled{opacity:.4;cursor:not-allowed}
  svg{display:block}

  #app{display:flex;flex-direction:column;height:100vh}
